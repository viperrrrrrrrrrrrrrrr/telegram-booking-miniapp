<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1f2" />
    <title>Petalune Nail Studio · Telegram Mini App by Ivan Litvin</title>
    <meta name="description" content="Telegram Mini App: book a manicure, pedicure or brows at Petalune Nail Studio. Sample prices. Made by Ivan Litvin." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Petalune · Telegram Mini App booking" />
    <meta property="og:description" content="Book nails in two taps inside Telegram. Sample prices. Made by Ivan Litvin." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Paint the right background before React boots (no white flash in dark mode).
      try {
        var t = localStorage.getItem('petalune.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This Telegram Mini App needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
