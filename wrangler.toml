# Cloudflare Pages project (static frontend in dist/ + Pages Functions in functions/).
name = "tg-booking-miniapp"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "tg-booking-db"
# Replace with the id printed by `npx wrangler d1 create tg-booking-db`.
database_id = "<your-d1-database-id>"
migrations_dir = "migrations"

[vars]
MINI_APP_URL = "https://tg-booking-miniapp.pages.dev"
TELEGRAM_API_BASE = "https://api.telegram.org"
INITDATA_MAX_AGE_SEC = "86400"
RATE_LIMIT_READS_PER_MIN = "120"
RATE_LIMIT_WRITES_PER_MIN = "20"
# Secrets (never commit) — set with `npx wrangler pages secret put <NAME> --project-name tg-booking-miniapp`:
#   BOT_TOKEN, WEBHOOK_SECRET, ADMIN_IDS, OWNER_CHAT_ID
